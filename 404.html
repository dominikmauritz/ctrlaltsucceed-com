<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | Ctrl Alt Succeed LLC</title>
    <meta
      name="description"
      content="Page not found on Ctrl Alt Succeed LLC."
    >
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Sora:wght@400;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --bg: #15141c;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.68);
        --soft: rgba(255, 255, 255, 0.42);
        --line: rgba(255, 255, 255, 0.14);
        --accent-start: #fa9048;
        --accent-end: #ff5473;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        --radius: 32px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--text);
        font-family: "Inter", sans-serif;
        background:
          linear-gradient(to top, rgba(21, 20, 28, 0.92), rgba(21, 20, 28, 0.84)),
          url("assets/images/bg.svg") center / cover no-repeat,
          var(--bg);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(1040px, calc(100% - 2rem));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        place-items: center;
        padding: 2rem 0;
      }

      .panel {
        position: relative;
        width: min(100%, 920px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)),
          rgba(12, 11, 18, 0.66);
        box-shadow: var(--shadow);
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at top left, rgba(250, 144, 72, 0.28), transparent 34%),
          radial-gradient(circle at bottom right, rgba(255, 84, 115, 0.22), transparent 30%);
        pointer-events: none;
      }

      .inner {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) 220px;
        gap: 2rem;
        align-items: end;
        padding: 3rem;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--soft);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 12ch;
        font-family: "Sora", sans-serif;
        font-size: clamp(3rem, 9vw, 6.5rem);
        line-height: 0.94;
      }

      .copy {
        margin: 1.35rem 0 0;
        max-width: 35rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.8;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
        margin-top: 2rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 11rem;
        padding: 0.95rem 1.35rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button-primary {
        background: linear-gradient(209deg, var(--accent-start), var(--accent-end));
        box-shadow: 0 16px 40px rgba(255, 84, 115, 0.26);
      }

      .button-secondary {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
      }

      .code-mark {
        justify-self: end;
        align-self: stretch;
        display: grid;
        place-items: center;
        min-height: 100%;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.14);
        font-family: "Sora", sans-serif;
        font-size: clamp(4rem, 10vw, 7rem);
        font-weight: 700;
        line-height: 1;
        user-select: none;
      }

      @media (max-width: 780px) {
        .page {
          width: min(100% - 1rem, 1040px);
        }

        .inner {
          grid-template-columns: 1fr;
          gap: 1.5rem;
          padding: 2rem 1.5rem;
        }

        .code-mark {
          justify-self: start;
          min-height: auto;
          padding-top: 1rem;
          border-left: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
      }

      @media (max-width: 520px) {
        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="page-title">
        <div class="inner">
          <div>
            <p class="eyebrow">Ctrl Alt Succeed LLC</p>
            <h1 id="page-title">Page not found.</h1>
            <p class="copy">
              This link drifted out of focus, or never existed in the first place.
              The good news: the rest of the site is still exactly where it should be.
            </p>
            <div class="actions">
              <a class="button button-primary" href="/">Back to home</a>
              <a class="button button-secondary" href="mailto:hello@ctrlaltsucceed.com">
                Say hello
              </a>
            </div>
          </div>
          <div class="code-mark" aria-hidden="true">404</div>
        </div>
      </section>
    </main>
  </body>
</html>
